<!doctype html>
<html lang="uk" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round'><path d='M4 7h12M4 12h9M4 17h6'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#161513" />
    <meta name="description" content="FastLearn — щоденна практика данської та англійської з миттєвим розбором слів і озвучкою." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FastLearn" />
    <title>FastLearn — практика мови</title>
    <script>
      (function () {
        try {
          var light = localStorage.getItem('fastlearn_theme') === 'light';
          document.documentElement.classList.toggle('dark', !light);
          document.documentElement.classList.toggle('light', light);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', light ? '#f6f5f1' : '#161513');
        } catch (error) {
          /* theme falls back to dark */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen overflow-hidden bg-[#f6f5f1] text-[#1c1917] antialiased dark:bg-[#161513] dark:text-[#efede8]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
