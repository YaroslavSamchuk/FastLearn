<!doctype html>
<html lang="uk" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round'><path d='M4 7h12M4 12h9M4 17h6'/></svg>"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0c0a09" />
    <meta name="description" content="FastLearn — спокійна щоденна практика данської та англійської з живим співрозмовником." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FastLearn" />
    <title>FastLearn — практика мови</title>
    <script>
      (function () {
        try {
          var light = localStorage.getItem('fastlearn_theme') === 'light';
          document.documentElement.classList.toggle('dark', !light);
          document.documentElement.classList.toggle('light', light);
        } catch (error) {
          /* theme falls back to dark */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&family=Geist:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="min-h-screen overflow-hidden bg-[#faf9f6] text-stone-900 antialiased transition-colors duration-200 dark:bg-[#0c0a09] dark:text-stone-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
